name: Aura rigged model evidence
on:
  pull_request:
    paths:
      - '.github/workflows/aura-rigged-model.yml'
      - 'runtime/scripts/inspect-aura-rig.mjs'
      - 'runtime/scripts/inspect-aura-v31.mjs'
      - 'runtime/scripts/install-aura-v31.mjs'
      - 'runtime/scripts/prepare-aura-v31.mjs'
      - 'runtime/package.json'
      - 'assets/aura-v31/**'
      - 'runtime/src/lib/auraRigLightform.mjs'
      - 'runtime/src/lib/auraSpeech*.mjs'
      - 'runtime/src/lib/vendor/headaudio/**'
      - 'runtime/src/components/AuraPortrait.tsx'
      - 'runtime/public/branding/aura-anatomical.glb'
      - 'openspec/changes/add-interactive-avatar/specs/interactive-avatar/spec.md'
      - 'openspec/changes/add-interactive-avatar/rigged-model-evaluation.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact CC0 model and inspect real skeleton and morphs
        run: node runtime/scripts/inspect-aura-rig.mjs
      - name: Verify V31 candidate if supplied (legacy evidence is not V31 approval)
        shell: bash
        run: |
          set -o pipefail
          node runtime/scripts/prepare-aura-v31.mjs
          if [ -f runtime/public/branding/aura-anatomical.glb ]; then
            node runtime/scripts/inspect-aura-v31.mjs runtime/public/branding/aura-anatomical.glb | tee aura-rig-evidence/v31-manifest.json
          else
            echo "::notice::V31 binary not supplied; V31 structural and visual acceptance remain pending."
            printf '%s\n' '{"version":"V31","structuralStatus":"NOT_TESTED","visualStatus":"NOT_TESTED","reason":"ASSET_MISSING"}' > aura-rig-evidence/v31-manifest.json
          fi
      - name: Test full facial speech pipeline contracts and pinned classifier
        run: |
          node --check runtime/src/lib/auraRigLightform.mjs
          node --check runtime/src/lib/auraSpeechWorker.mjs
          node --check runtime/src/lib/auraSpeechAnalysis.mjs
          node --test runtime/src/lib/auraSpeechTimeline.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aura-verified-rig
          path: aura-rig-evidence/
          retention-days: 7

name: Cognitive Live Workspace

on:
  pull_request:
    paths:
      - 'runtime/src/components/Cognitive*.tsx'
      - 'runtime/src/components/AuraChatPanel.tsx'
      - 'runtime/src/components/JacoAuraComputeIDE.tsx'
      - 'runtime/src/hooks/useCognitiveLive.ts'
      - 'runtime/src/cognitive-workspace.css'
      - 'runtime/src/lib/cognitiveEvents.mjs'
      - 'runtime/src/lib/novaActivityText.ts'
      - 'runtime/src/server/connected/cognitive*.mjs'
      - 'runtime/server.ts'
      - 'tests/nova/cognitive*'
      - 'tests/nova/aura-seer-chat.test.mjs'
      - 'tests/nova/aura-chat-session.test.mjs'
      - 'tests/nova/aura-gui-audit.test.mjs'
      - 'tests/nova/aura-truthful-gui.test.mjs'
      - 'tests/nova/nova-activity-text.test.mjs'
      - '.github/workflows/cognitive-workspace-gate.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/src/components/Cognitive*.tsx'
      - 'runtime/src/components/AuraChatPanel.tsx'
      - 'runtime/src/components/JacoAuraComputeIDE.tsx'
      - 'runtime/src/hooks/useCognitiveLive.ts'
      - 'runtime/src/cognitive-workspace.css'
      - 'runtime/src/lib/cognitiveEvents.mjs'
      - 'runtime/src/lib/novaActivityText.ts'
      - 'runtime/src/server/connected/cognitive*.mjs'
      - 'tests/nova/cognitive*'
      - '.github/workflows/cognitive-workspace-gate.yml'

permissions:
  contents: read

jobs:
  observed-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JACO_UI_SCREENSHOTS: ${{ github.workspace }}/test-results/cognitive-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install canonical client and server dependencies
        run: npm ci --prefix runtime
      - name: TypeScript and production builds
        working-directory: runtime
        run: |
          npm run lint
          npm run build:client
          npm run build:server
      - name: Evidence, durable replay, chat storage and GUI contracts
        run: node --test tests/nova/cognitive-live.test.mjs tests/nova/aura-chat-session.test.mjs tests/nova/aura-truthful-gui.test.mjs tests/nova/aura-gui-audit.test.mjs tests/nova/nova-activity-text.test.mjs tests/nova/aura-seer-chat.test.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/jaco-browser" --no-package-lock --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/jaco-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "JACO_PLAYWRIGHT_MODULE=$RUNNER_TEMP/jaco-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Production UI integration on desktop and mobile viewport
        run: node tests/nova/cognitive-workspace.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cognitive-workspace-controlled-ui
          path: test-results/cognitive-workspace
          if-no-files-found: ignore

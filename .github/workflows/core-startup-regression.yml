name: Core startup regression
on:
  pull_request:
    paths:
      - 'agents/lib/local-stack.mjs'
      - 'agents/lib/chrome-bootstrap.mjs'
      - 'agents/lib/lite-browser-supervisor.mjs'
      - 'agents/lib/org-permission.mjs'
      - 'runtime/src/server/connected/githubGuiAuth.mjs'
      - 'runtime/src/server/connected/agentOrganization.mjs'
      - 'runtime/src/server/connected/automaticConnections.mjs'
      - 'tests/nova/startup-developer-connections.test.mjs'
      - 'tools/build-lite.mjs'
      - 'lite/start.mjs'
      - 'tests/nova/lite.test.mjs'
      - 'agents/lib/planner-choice.mjs'
      - 'runtime/server.ts'
      - 'site/jacocode.com/worker.mjs'
      - 'site/jacocode.com/cloud-install.mjs'
      - 'cloud/control/handoff.mjs'
      - 'cloud/control/**'
      - 'tests/nova/cloud-control-handoff.test.mjs'
      - 'site/jacocode.com/link-protocol.mjs'
      - 'runtime/src/server/connected/jacoLinkHost.mjs'
      - 'runtime/gateway/src/sentinel.mjs'
      - 'tests/nova/cloud-install-plan.test.mjs'
      - 'tests/nova/cloud-handoff.test.mjs'
      - 'tests/nova/link-sentinel-handoff.test.mjs'
      - 'tests/nova/jaco-link-saas.test.mjs'
      - 'runtime/package.json'
      - 'scripts/verify-core-startup.mjs'
      - 'tests/nova/startup-safety.test.mjs'
      - 'tests/nova/planner-choice.test.mjs'
      - '.github/workflows/core-startup-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm ci --prefix runtime --no-audit --no-fund
      - run: node --check agents/lib/local-stack.mjs && node --check agents/lib/planner-choice.mjs && node --check scripts/verify-core-startup.mjs
      - run: node --test tests/nova/startup-safety.test.mjs tests/nova/planner-choice.test.mjs tests/nova/remote-startup-contract.test.mjs tests/nova/lite.test.mjs tests/nova/startup-developer-connections.test.mjs tests/nova/agent-organization.test.mjs tests/nova/mission.test.mjs
      - name: JACO Cloud and Sentinel Link syntax
        run: node --check cloud/control/handoff.mjs && node --check cloud/control/handoff.mjs && node --check site/jacocode.com/cloud-install.mjs && node --check site/jacocode.com/worker.mjs && node --check runtime/gateway/src/sentinel.mjs && node --check runtime/src/server/connected/jacoLinkHost.mjs
      - name: JACO Cloud install and single-host cold-start contract
        run: node --test tests/nova/cloud-control-handoff.test.mjs tests/nova/cloud-install-plan.test.mjs tests/nova/cloud-handoff.test.mjs tests/nova/link-sentinel-handoff.test.mjs tests/nova/jaco-link-saas.test.mjs
      - run: npm --prefix runtime run build
      - run: node scripts/verify-core-startup.mjs

jobs:
  truth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked contract dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Setup and npm distribution
        run: node --test tests/nova/setup.test.mjs tests/nova/package-content.test.mjs
      - name: Workbench truth contract
        run: node --test tests/nova/aura-truthful-gui.test.mjs tests/nova/aura-seer-chat.test.mjs tests/nova/aura-single-agent-functions.test.mjs tests/nova/nova-activity-text.test.mjs
      - name: Aura control plane, browser WebSocket and false-READY regressions
        run: node --experimental-sqlite --test tests/nova/aura-cdp-truth.test.mjs tests/nova/aura-oversight.test.mjs tests/nova/cdp-mcp.test.mjs tests/nova/bridges.test.mjs tests/nova/aura-termux-service-health.test.mjs tests/nova/aura-agent-board.test.mjs
      - name: Activation and provider truth regressions
        run: |
          node --check agents/jaco-cli.mjs
          node --check agents/lib/activate.mjs
          node --test tests/nova/activate.test.mjs tests/nova/aura-provider-registry.test.mjs tests/nova/planner-choice.test.mjs
          bash -n runtime/bin/jaco
      - name: Gameboard projection and deterministic simulator
        run: node --experimental-sqlite --test tests/nova/gameboard-fabric.test.mjs tests/nova/gameboard-exchange.test.mjs
      - name: Android Lite launcher syntax
        run: bash -n lite/START-ANDROID.sh
      - name: Workplace authority projection
        run: node --experimental-sqlite --test tests/workplace/workplace.test.mjs
      - name: ChatGPT gateway policy
        run: node gateway/test/chatgpt-nova-gateway.test.mjs
      - name: Operator acceptance probe syntax
        run: node --check runtime/scripts/verify_aura_operator_workbench.mjs

  canonical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install
        run: npm ci
      - name: Install gateway MCP dependencies
        run: npm ci --prefix gateway
      - name: VS Code MCP client handshake
        run: node ../tests/mcp/client-configs.test.mjs
      - name: TypeScript — complete runtime
        run: npm run lint
      - name: Execution test dependencies
        run: npm ci --prefix .. --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Workspace readiness and visible decisions
        run: npm run test:workspace-ux && node --test ../tests/nova/workspace-readiness.test.mjs ../tests/nova/agent-network.test.mjs ../tests/nova/workspace-integrations.test.mjs
      - name: Organization mandate and risk preview regressions
        run: node --test ../tests/nova/agent-organization.test.mjs
      - name: Production build (client before server)
        run: npm run build
      - name: Production boot and IDE HTTP smoke
        run: node scripts/verify_production_boot.mjs

name: MCP OAuth read-only pilot

on:
  pull_request:
    paths:
      - 'runtime/src/server/mcp/oauthReadonly*.mjs'
      - 'tests/nova/mcp-oauth-readonly.test.mjs'
      - '.github/workflows/mcp-oauth-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check runtime/src/server/mcp/oauthReadonly.mjs
          node --check runtime/src/server/mcp/oauthReadonlySession.mjs
          node --check tests/nova/mcp-oauth-readonly.test.mjs
      - name: OAuth fixtures and local callback (no external account)
        run: node --test tests/nova/mcp-oauth-readonly.test.mjs

<!doctype html>
<html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auras blick · JACO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#e4edf7;font:16px system-ui}main{max-width:960px;margin:6vh auto;padding:16px}h1{font-size:1.4rem}section{display:grid;grid-template-columns:1fr 1fr;gap:10px}figure{margin:0}figcaption{margin-bottom:8px}figure div{aspect-ratio:1;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0a1f4a,#01030a);border-radius:9px}canvas{width:100%;height:100%;display:block;transform:scale(1.6);transform-origin:50% 20%}button{margin-top:18px;padding:10px 16px;border-radius:6px;cursor:pointer}output{margin-left:12px}
</style><main><h1>Auras blick</h1><section><figure><figcaption>Original</figcaption><div><canvas></canvas></div></figure><figure><figcaption>Mjukare blick</figcaption><div><canvas></canvas></div></figure></section><button disabled>Visa lyssnande</button><output aria-live="polite">Laddar porträtten…</output></main>
<script type="module">
import {createAuraRigLightform} from './src/lib/auraRigLightform.mjs';
const button=document.querySelector('button'), status=document.querySelector('output');
try {
  const portraits=await Promise.all([...document.querySelectorAll('canvas')].map((canvas,i)=>
    createAuraRigLightform(canvas,{relaxedGaze:i===1,trackPointer:false})));
  let listening=false;
  button.disabled=false;
  status.textContent='Vila';
  button.onclick=()=>{
    listening=!listening;
    portraits.forEach(p=>p.setState({listening}));
    status.textContent=listening?'Lyssnar':'Vila';
    button.textContent=listening?'Visa vila':'Visa lyssnande';
  };
  window.addEventListener('pagehide',()=>portraits.forEach(p=>p.dispose()),{once:true});
} catch { status.textContent='Porträtten kunde inte laddas.'; }
</script></html>

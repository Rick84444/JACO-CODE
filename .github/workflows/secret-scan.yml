name: Repository Secret Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect-publishable-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Scan all tracked and publishable text files (including tests)
        run: node runtime/scripts/verify_secret_patterns.mjs
      - name: Verify the scanner's test-fixture and fail-closed regressions
        run: node --test tests/nova/repo-has-no-secrets.test.mjs

name: Sentinel Bootstrap Gate

on:
  pull_request:
    paths:
      - 'runtime/gateway/src/sentinel.mjs'
      - 'runtime/gateway/src/system-control.mjs'
      - 'runtime/gateway/src/config.mjs'
      - 'runtime/gateway/src/github-bootstrap-control.mjs'
      - 'runtime/gateway/test/github-bootstrap-control.test.mjs'
      - 'runtime/gateway/test/system-control-update.test.mjs'
      - 'runtime/termux/restart-sentinel-after-delay.sh'
      - 'runtime/gateway/package.json'
      - 'runtime/gateway/package-lock.json'
      - 'runtime/termux/install-activation.sh'
      - '.github/workflows/sentinel-bootstrap-gate.yml'
  push:
    branches: [master]
    paths:
      - 'runtime/gateway/src/sentinel.mjs'
      - 'runtime/gateway/src/system-control.mjs'
      - 'runtime/gateway/src/config.mjs'
      - 'runtime/gateway/src/github-bootstrap-control.mjs'
      - 'runtime/gateway/test/github-bootstrap-control.test.mjs'
      - 'runtime/gateway/test/system-control-update.test.mjs'
      - 'runtime/termux/restart-sentinel-after-delay.sh'
      - 'runtime/gateway/package.json'
      - 'runtime/gateway/package-lock.json'
      - 'runtime/termux/install-activation.sh'
      - '.github/workflows/sentinel-bootstrap-gate.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/gateway/package-lock.json
      - name: Install gateway dependencies
        run: npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check gateway/src/github-bootstrap-control.mjs
          node --check gateway/src/sentinel.mjs
          node --check gateway/src/system-control.mjs
          node --check gateway/test/github-bootstrap-control.test.mjs
          node --check gateway/test/system-control-update.test.mjs
          bash -n termux/install-activation.sh
          bash -n termux/restart-sentinel-after-delay.sh
      - name: Gateway regression suite
        run: npm test --prefix gateway

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aura Operator Stage</title>
  <link rel="stylesheet" href="/stage.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <header class="bar">
    <div class="brand"><img class="logo" src="/branding/jaco-logo.png" alt="JACO"><span class="dot" id="liveDot" title="Live connection"></span></div>
    <div class="status" id="status">Connecting to Aura…</div>
    <div class="model-box">
      <button type="button" class="ide" id="modelBtn" aria-haspopup="dialog" aria-expanded="false" title="Choose the model Aura thinks with">Model</button>
      <div class="model-pop" id="modelPop" hidden role="dialog" aria-label="Choose Aura's model">
        <label>Provider <select id="modelProvider"></select></label>
        <label>Model <select id="modelName"></select></label>
        <div class="model-row"><button type="button" id="modelUse">Use this model</button><span id="modelState" aria-live="polite"></span></div>
      </div>
    </div>
    <button type="button" class="ide" id="ideToggle" aria-pressed="false" title="Open the IDE beside Aura">IDE beside</button>
  </header>
  <main id="stage">
    <div class="rail left" id="railLeft" aria-label="Strategy and current work"></div>
    <section class="center" aria-label="Conversation with Aura">
      <div class="aura" id="aura">
        <canvas id="orb" width="560" height="560" role="img" aria-label="Aura"></canvas>
        <div class="aura-line" id="auraLine" aria-live="polite">Here with you</div>
        <div class="aura-model" id="auraModel"></div>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="composer">
        <button type="button" class="talk" id="talk" aria-pressed="false" title="Talk with Aura: she listens, answers aloud and listens again">Talk</button>
        <textarea id="input" rows="1" placeholder="Talk to Aura…" aria-label="Message to Aura"></textarea>
        <button type="button" class="voice" id="voice" aria-pressed="false" title="Read Aura's replies aloud">Voice</button>
        <button type="submit" id="send" aria-label="Send">Send</button>
      </form>
      <div class="voice-note" id="voiceNote" hidden></div>
    </section>
    <div class="rail right" id="railRight" aria-label="What Aura is using"></div>
  </main>
  <aside class="ide-pane" id="idePane" hidden aria-label="JACO IDE">
    <div class="ide-resize" id="ideResize" title="Drag to resize"></div>
    <div class="ide-bar"><span>IDE</span><a href="/ide" target="_blank" rel="noopener">Own window</a><button type="button" id="ideClose">Close</button></div>
    <iframe id="ideFrame" title="JACO IDE"></iframe>
  </aside>
  <div class="viewer" id="viewer" hidden role="dialog" aria-label="Aura's browser">
    <div class="viewer-frame">
      <div class="viewer-head"><span id="viewerTitle">Aura's browser</span>
        <button type="button" id="viewerOpen">Open real window</button>
        <button type="button" id="viewerClose" aria-label="Close">Close</button></div>
      <img id="viewerImg" alt="What Aura sees in her browser">
    </div>
  </div>
  <script type="module" src="/stage.js"></script>
</body>
</html>

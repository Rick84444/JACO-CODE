name: Cognitive Autonomous Cycles

on:
  push:
    paths:
      - 'agents/cognitive-lab/**'
      - 'agents/lib/cognitive-*.mjs'
      - 'tests/cognitive-lab/**'
      - 'tests/nova/cognitive-capsule.test.mjs'
      - 'runtime/src/server/continuum/leaseManager.mjs'
      - 'runtime/src/server/connected/autonomousCycleBoard.mjs'
      - 'runtime/src/components/AutonomousCyclesPanel.tsx'
      - 'runtime/src/components/AuraAgentBoard.tsx'
      - '.github/workflows/cognitive-autonomous-cycles.yml'
  pull_request:
    paths:
      - 'agents/cognitive-lab/**'
      - 'agents/lib/cognitive-*.mjs'
      - 'tests/cognitive-lab/**'
      - 'tests/nova/cognitive-capsule.test.mjs'
      - 'runtime/src/server/continuum/leaseManager.mjs'
      - 'runtime/src/server/connected/autonomousCycleBoard.mjs'
      - 'runtime/src/components/AutonomousCyclesPanel.tsx'
      - 'runtime/src/components/AuraAgentBoard.tsx'
      - '.github/workflows/cognitive-autonomous-cycles.yml'

permissions:
  contents: read

jobs:
  deterministic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Validate roles, debt gate, ledger UI and 33 development cycles
        run: node --test tests/cognitive-lab/*.test.mjs tests/nova/cognitive-capsule.test.mjs
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quotedesk</title><link rel="stylesheet" href="../shared/style.css"></head><body><main><header><small>JACO Alpha Lab / 03</small><h1>Quotedesk</h1><p>SEK quotation calculator with integer-öre arithmetic, discount and VAT.</p><a href="../index.html">All projects</a></header><form id="form"><label>Description<input name="name" required maxlength="100"></label><label>Quantity<input name="qty" type="number" min="1" max="10000" required></label><label>Unit price (SEK)<input name="price" type="number" min="0" max="1000000" step=".01" required></label><button>Add line</button></form><section class="scroll" id="lines"></section><form id="rates"><label>Discount %<input id="discount" name="discount" type="number" min="0" max="100" value="0" required></label><label>VAT %<select id="vat" name="vat"><option>25</option><option>12</option><option>6</option><option>0</option></select></label><button>Calculate</button></form><div class="grid" id="totals"></div><output id="status" aria-live="polite"></output></main><script type="module" src="./app.mjs"></script></body></html>

name: Android native engine
on:
  pull_request:
    paths:
      - 'runtime/modules/runtime/native-intelligence-fabric/native/android/**'
      - '.github/workflows/android-native.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/modules/runtime/native-intelligence-fabric/native/android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime/modules/runtime/native-intelligence-fabric/native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Kotlin regression tests, APK and Android lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-debug
          path: runtime/modules/runtime/native-intelligence-fabric/native/android/app/build/outputs/apk/debug/app-debug.apk
